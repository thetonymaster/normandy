# Tempo + Grafana for `NORMANDY_E2E_OTLP=1 mix e2e`. See e2e/otel/README.md.
#   docker compose -f e2e/otel/docker-compose.yml up -d
# Grafana: http://localhost:3000 (anonymous admin) → Explore → Tempo.
services:
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      - /var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    ports:
      - "3000:3000"
    depends_on: [tempo]
