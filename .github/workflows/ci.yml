name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.15'
  OTP_VERSION: '26'

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ['1.15', '1.16', '1.17']
        otp: ['26', '27']
        exclude:
          # OTP 27 requires Elixir 1.17+
          - elixir: '1.15'
            otp: '27'
          - elixir: '1.16'
            otp: '27'
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Check formatting
        run: mix format --check-formatted
        if: matrix.elixir == '1.17' && matrix.otp == '27'

      - name: Compile project (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run unit tests
        run: mix test

      - name: Generate coverage report
        run: mix test --cover
        if: matrix.elixir == '1.17' && matrix.otp == '27'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run integration tests if unit tests pass
    needs: test
    # Only run on pushes to main — integration tests hit the real Anthropic API
    # and saturate a 50 RPM org limit; PR branches would thrash that quota.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run integration tests
        env:
          # Set API key from GitHub secrets if available
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model for the live integration suite. Empty when the repo variable is
          # unset; default_model/1 falls back to a current model in that case.
          NORMANDY_TEST_MODEL: ${{ vars.NORMANDY_TEST_MODEL }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Running integration tests with API key"
            export API_KEY="$API_KEY"
            mix test --only integration --only normandy_integration
          else
            echo "⚠️  Skipping integration tests - ANTHROPIC_API_KEY secret not set"
            echo "To run integration tests in CI, add ANTHROPIC_API_KEY to repository secrets"
            exit 0
          fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Pinned to the toolchain the Dialyzer ignore set was verified against (Elixir 1.19 /
    # OTP 28); warning sets vary across versions, so these gates run on one modern version.
    # MIX_ENV=test (workflow env) matches `mix precommit`, so one PLT serves both.
    env:
      ELIXIR_VERSION: '1.19'
      OTP_VERSION: '28'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # _build includes the Dialyzer PLTs (plt_core_path/plt_local_path: "_build/plts").
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Audit dependencies (retirements and security advisories)
        run: mix hex.audit

      - name: Check for outdated dependencies
        run: mix hex.outdated
        continue-on-error: true

      # Tier-0 users install none of the optional deps (ecto_sql, postgrex, horde, redix);
      # lib/ must compile without them. MIX_ENV=dev: test/support needs them.
      - name: Compile without optional dependencies
        env:
          MIX_ENV: dev
        run: mix compile --no-optional-deps --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer --format github

      # ex_doc is a :dev-only dependency.
      - name: Docs build without warnings
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors

  # Consumers ignore our mix.lock: test against the newest versions our requirements allow.
  unlocked-deps:
    name: Test with unlocked dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Unlock and fetch latest dependencies
        run: |
          mix deps.unlock --all
          mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run unit tests
        run: mix test

  postgres:
    name: Postgres session store tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Excluded from `mix test`; config/test.exs defaults (localhost, postgres/postgres) match this service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-postgres-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-postgres-1.19-28-

      - name: Install dependencies
        run: mix deps.get

      - name: Run postgres session store tests
        run: mix test.postgres

  redis:
    name: Redis session store and registry tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Excluded from `mix test`; config/test.exs defaults to redis://localhost:6379, this service.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-redis-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-redis-1.19-28-

      - name: Install dependencies
        run: mix deps.get

      - name: Run redis session store and registry tests
        run: mix test.redis

  distributed:
    name: Distributed (multi-node) tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The :distributed files spawn :peer nodes (needs epmd) and some use Postgres or
    # Redis; all of them are excluded from `mix test`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-distributed-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-distributed-1.19-28-

      - name: Install dependencies
        run: mix deps.get

      - name: Start epmd
        run: epmd -daemon

      # test.postgres sets up the database; NORMANDY_REDIS enables the Redis-backed files.
      - name: Run distributed tests
        env:
          NORMANDY_REDIS: 'true'
        run: mix test.postgres --only distributed

  all-checks-complete:
    name: All Checks Passed
    if: always()
    needs: [test, integration-tests, quality, unlocked-deps, postgres, redis, distributed]
    runs-on: ubuntu-latest

    steps:
      - name: Check all job results
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.unlocked-deps.result }}" != "success" ] || \
             [ "${{ needs.postgres.result }}" != "success" ] || \
             [ "${{ needs.redis.result }}" != "success" ] || \
             [ "${{ needs.distributed.result }}" != "success" ]; then
            echo "❌ Some required checks failed"
            exit 1
          fi

          # Integration tests are allowed to be skipped (when API key not available)
          if [ "${{ needs.integration-tests.result }}" != "success" ] && \
             [ "${{ needs.integration-tests.result }}" != "skipped" ]; then
            echo "❌ Integration tests failed"
            exit 1
          fi

          echo "✅ All checks passed!"
